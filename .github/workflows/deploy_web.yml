name: Deploy VoDan Web to Vercel

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - ".github/workflows/deploy_web.yml"

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"

      - name: Create Flutter environment file
        working-directory: app
        run: |
          printf 'SUPABASE_URL=%s\nSUPABASE_PUBLISHABLE_KEY=%s\n' \
            "${{ secrets.SUPABASE_URL }}" \
            "${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" > .env

      - name: Install Dependencies
        working-directory: app
        run: flutter pub get

      - name: Generate Dart Code
        working-directory: app
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Flutter Web
        working-directory: app
        run: |
          flutter build web --release
          cp vercel.json build/web/vercel.json

      - name: Deploy to Vercel
        run: npx vercel deploy app/build/web --prod --yes --name vodan --token "${{ secrets.VERCEL_TOKEN }}"